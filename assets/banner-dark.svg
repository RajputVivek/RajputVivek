<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" role="img" aria-label="Vivek Rajput — Product-Minded Frontend Engineer">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#11161F"/>
      <stop offset="100%" stop-color="#151B26"/>
    </linearGradient>
    <linearGradient id="accent-line-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9532F"/>
      <stop offset="45%" stop-color="#E87D55"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="0.75" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="10" fill="url(#bg-dark)" stroke="#30363D" stroke-width="1.5"/>
  <rect width="1200" height="300" rx="10" fill="url(#grid-dark)"/>

  <!-- Subtle Right Architectural Geometry -->
  <g opacity="0.85">
    <rect x="830" y="38" width="320" height="224" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    <line x1="830" y1="72" x2="1150" y2="72" stroke="#21262D" stroke-width="1"/>
    <circle cx="850" cy="55" r="4.5" fill="#D9532F"/>
    <circle cx="866" cy="55" r="4.5" fill="#30363D"/>
    <circle cx="882" cy="55" r="4.5" fill="#30363D"/>
    <text x="904" y="59" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8B949E" letter-spacing="1">SPEC // VVEK.DEV</text>

    <!-- Architectural Metrics / Code Spec Block -->
    <text x="854" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8B949E">01  <tspan fill="#E6EDF3">Product UI Architecture</tspan></text>
    <text x="854" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8B949E">02  <tspan fill="#E6EDF3">Assessment &amp; Analytics</tspan></text>
    <text x="854" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8B949E">03  <tspan fill="#E6EDF3">Stateful Edge Systems</tspan></text>
    <text x="854" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8B949E">04  <tspan fill="#E6EDF3">AI-Assisted Engineering</tspan></text>

    <line x1="854" y1="212" x2="1126" y2="212" stroke="#21262D" stroke-width="1"/>
    <circle cx="860" cy="234" r="4" fill="#3FB950"/>
    <text x="874" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8B949E" letter-spacing="0.8">SHIPPING PRODUCTION SOFTWARE</text>
  </g>

  <!-- Top Editorial Eyebrow -->
  <rect x="56" y="46" width="10" height="10" fill="#D9532F"/>
  <text x="78" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#D9532F" letter-spacing="2.5">ENGINEERING DOSSIER // 05+ YRS PRODUCTION UI</text>

  <!-- Main Name & Headline -->
  <text x="56" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#F0F6FC" letter-spacing="-1">Vivek Rajput</text>

  <!-- Subtitle / Positioning -->
  <text x="56" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#C9D1D9">Product-Minded Frontend Engineer <tspan fill="#8B949E" font-weight="400">— Building toward Lead Frontend Engineering</tspan></text>

  <!-- Accent Divider -->
  <rect x="56" y="190" width="720" height="2" fill="url(#accent-line-dark)"/>

  <!-- Bottom Pillar Tags -->
  <text x="56" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#8B949E">
    <tspan fill="#E6EDF3" font-weight="600">Select10X</tspan> UI Developer   ·   <tspan fill="#E6EDF3" font-weight="600">JoinCove</tspan> Creator (joincove.app)   ·   <tspan fill="#D9532F" font-weight="600">vvek.dev</tspan>
  </text>
  <text x="56" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E" font-style="italic">
    "Frontend engineering isn't just writing components — it's understanding products, designing experiences, and shipping reliable software."
  </text>
</svg>

