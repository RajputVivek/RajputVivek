<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" role="img" aria-label="Vivek Rajput — Product-Minded Frontend Engineer">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="65%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#EDE6DA"/>
    </linearGradient>
    <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8431F"/>
      <stop offset="45%" stop-color="#DF6D48"/>
      <stop offset="100%" stop-color="#D8D0C5" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DBD0" stroke-width="0.75" stroke-opacity="0.75"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="10" fill="url(#bg-light)" stroke="#D8D0C5" stroke-width="1.5"/>
  <rect width="1200" height="300" rx="10" fill="url(#grid-light)"/>

  <!-- Subtle Right Architectural Geometry -->
  <g opacity="0.95">
    <rect x="830" y="38" width="320" height="224" rx="6" fill="#FAF7F2" stroke="#D8D0C5" stroke-width="1"/>
    <line x1="830" y1="72" x2="1150" y2="72" stroke="#E5DEC9" stroke-width="1"/>
    <circle cx="850" cy="55" r="4.5" fill="#C8431F"/>
    <circle cx="866" cy="55" r="4.5" fill="#D8D0C5"/>
    <circle cx="882" cy="55" r="4.5" fill="#D8D0C5"/>
    <text x="904" y="59" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#655E57" letter-spacing="1">SPEC // VVEK.DEV</text>

    <!-- Architectural Metrics / Code Spec Block -->
    <text x="854" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#7A7267">01  <tspan fill="#161412" font-weight="500">Product UI Architecture</tspan></text>
    <text x="854" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#7A7267">02  <tspan fill="#161412" font-weight="500">Assessment &amp; Analytics</tspan></text>
    <text x="854" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#7A7267">03  <tspan fill="#161412" font-weight="500">Stateful Edge Systems</tspan></text>
    <text x="854" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#7A7267">04  <tspan fill="#161412" font-weight="500">AI-Assisted Engineering</tspan></text>

    <line x1="854" y1="212" x2="1126" y2="212" stroke="#E5DEC9" stroke-width="1"/>
    <circle cx="860" cy="234" r="4" fill="#1F7A4C"/>
    <text x="874" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#57514B" letter-spacing="0.8">SHIPPING PRODUCTION SOFTWARE</text>
  </g>

  <!-- Top Editorial Eyebrow -->
  <rect x="56" y="46" width="10" height="10" fill="#C8431F"/>
  <text x="78" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#C8431F" letter-spacing="2.5">ENGINEERING DOSSIER // 05+ YRS PRODUCTION UI</text>

  <!-- Main Name & Headline -->
  <text x="56" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#161412" letter-spacing="-1">Vivek Rajput</text>

  <!-- Subtitle / Positioning -->
  <text x="56" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2E2A27">Product-Minded Frontend Engineer <tspan fill="#655E57" font-weight="400">— Building toward Lead Frontend Engineering</tspan></text>

  <!-- Accent Divider -->
  <rect x="56" y="190" width="720" height="2" fill="url(#accent-line-light)"/>

  <!-- Bottom Pillar Tags -->
  <text x="56" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#57514B">
    <tspan fill="#161412" font-weight="600">Select10X</tspan> UI Developer   ·   <tspan fill="#161412" font-weight="600">JoinCove</tspan> Creator (joincove.app)   ·   <tspan fill="#C8431F" font-weight="600">vvek.dev</tspan>
  </text>
  <text x="56" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57514B" font-style="italic">
    "Frontend engineering isn't just writing components — it's understanding products, designing experiences, and shipping reliable software."
  </text>
</svg>

